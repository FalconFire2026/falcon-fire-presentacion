<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Falcon Fire · Acceso</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#0b2a6b,#030b1f 70%);font-family:Poppins,Segoe UI,Arial,sans-serif;color:#fff}
.b{width:min(92vw,420px);padding:36px 32px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);text-align:center}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 22px;font-size:14px;opacity:.75}
input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;font-size:16px;outline:none}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;background:#e11d2e;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#m{min-height:20px;margin-top:12px;font-size:14px;color:#ffb4b4}</style></head><body>
<form class="b" id="f"><h1>Presentación comercial Falcon Fire</h1><p>Contenido privado. Ingrese la clave de acceso.</p>
<input id="pw" type="password" placeholder="Clave de acceso" autocomplete="current-password" autofocus><button id="bt">Ingresar</button><div id="m"></div></form>
<script>
const SALT="LcNGwO689eMkx/yLqrv7Sg==",IT=600000,B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null;const cache={};
async function dec(buf){const a=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},KEY,a.slice(12))}
window.__vsrc=p=>cache[p]||(cache[p]=(async()=>{const r=await fetch(p);if(!r.ok)throw 1;const d=await dec(await r.arrayBuffer());return URL.createObjectURL(new Blob([d],{type:'video/mp4'}))})().catch(e=>{delete cache[p];throw e}));
const __VORD=['video/vir-riv-naffco.mp4', 'video/vehiculo-arff.mp4', 'video/vehiculos-naffco.mp4', 'video/bombas-produccion.mp4', 'video/planta-produccion.mp4'];
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('m'),bt=document.getElementById('bt');bt.disabled=true;m.style.color='#cfe';m.textContent='Verificando…';
try{const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
KEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:B(SALT),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const r=await fetch('app.bin');m.textContent='Abriendo presentación…';const t=new TextDecoder().decode(await dec(await r.arrayBuffer()));
document.open();document.write(t);document.close();(async()=>{for(const p of __VORD){try{await window.__vsrc(p)}catch(e){}}})()}
catch(x){KEY=null;bt.disabled=false;m.style.color='#ffb4b4';m.textContent='Clave incorrecta. Intente de nuevo.'}};
</script></body></html>
